# Baut eine Vorschau-Version (Hinweisbalken, nicht bei Google, Formular ohne Versand)
# und veröffentlicht sie auf GitHub Pages: https://hen1403.github.io/memorybox/
# Voraussetzung: Settings → Pages → Source: „GitHub Actions“
name: Vorschau

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vorschau
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VORSCHAU: 'true'
          SEITE: https://hen1403.github.io
          BASIS: /memorybox
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
